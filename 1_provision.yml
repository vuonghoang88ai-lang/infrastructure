---
# ===================================================================
# PLAY 1: TẠO MÁY BẰNG DHCP VÀ HỎI PROXMOX LẤY IP ĐỘNG
# ===================================================================
- name: "Tạo VM (DHCP) và chờ QEMU Agent"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_target: "{{ target_env }}"
    base_subnet: "192.168.2"
    gw_ip: "192.168.2.1"
    ip_pools:
      live: { start: 100, end: 149 }
      staging: { start: 150, end: 199 }
      testing: { start: 200, end: 249 }

    pve_api_pass: "{{ lookup('env', 'VAULT_PROXMOX_PASS') }}"
    ci_pass: "{{ lookup('env', 'VAULT_CLOUDINIT_PASS') }}"
    ci_ssh_key: "{{ lookup('env', 'VAULT_SSH_PUB_KEY') }}"

    pve_api_host: "192.168.2.15"
    pve_api_user: "root@pam"

  tasks:
    - name: "Lấy danh sách IP đã dùng từ inventory.ini"
      shell: "awk '/^\\[{{ env_target }}\\]/{flag=1; next} /^\\[/{flag=0} flag && NF {print $1}' inventory.ini"
      register: used_ips_result
      changed_when: false

    - name: "Tính toán IP tĩnh sẽ được gán"
      set_fact:
        all_pool_ips: "{{ range(ip_pools[env_target].start, ip_pools[env_target].end + 1) | map('regex_replace', '^(.*)$', base_subnet ~ '.\\1') | list }}"
        used_ips: "{{ used_ips_result.stdout_lines }}"

    - name: "Chốt IP Tĩnh mục tiêu (Ping check lấp khoảng trống)"
      shell: "ping -c 1 -W 1 {{ item }} > /dev/null 2>&1"
      loop: "{{ all_pool_ips | difference(used_ips) }}"
      register: ping_results
      ignore_errors: true
      changed_when: false

    - name: "Xác định Target Static IP"
      set_fact:
        target_static_ip: "{{ item.item }}"
      loop: "{{ ping_results.results }}"
      when: item.rc != 0 and target_static_ip is not defined
      no_log: true

    - name: "Xác thực API Proxmox"
      uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body: { username: "{{ pve_api_user }}", password: "{{ pve_api_pass }}" }
        validate_certs: false
      register: pve_auth

    - name: "Lấy ID trống tiếp theo"
      uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/cluster/nextid"
        method: GET
        headers: { Cookie: "PVEAuthCookie={{ pve_auth.json.data.ticket }}" }
        validate_certs: false
      register: pve_nextid

    - name: "Quét toàn bộ cụm Proxmox để định vị Template 9002"
      uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers: { Cookie: "PVEAuthCookie={{ pve_auth.json.data.ticket }}" }
        validate_certs: false
      register: cluster_vms

    - name: "Trích xuất TÊN và vị trí NODE của Template 9002"
      set_fact:
        pve_node: "{{ item.node }}"
        template_name: "{{ item.name }}"
      loop: "{{ cluster_vms.json.data }}"
      when: item.vmid | int == 9002
      no_log: true

    - name: "Kiểm tra sự tồn tại của Template"
      fail:
        msg: "CRITICAL: Không tìm thấy bất kỳ máy ảo/template nào có ID là 9002!"
      when: template_name is not defined

    - name: "Khởi tạo thông số VM"
      set_fact:
        new_vm_id: "{{ pve_nextid.json.data }}"
        new_vm_name: "Web-{{ env_target | capitalize }}-{{ pve_nextid.json.data }}"

    - name: "BƯỚC 1: Nhân bản & Cấu hình mạng DHCP từ Template 9002"
      community.general.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_pass }}"
        validate_certs: false
        node: "{{ pve_node }}"
        name: "{{ new_vm_name }}"
        clone: "{{ template_name }}"
        full: yes
        ciuser: ubuntu
        cipassword: "{{ ci_pass }}"
        sshkeys: "{{ ci_ssh_key }}"
        ipconfig:
          ipconfig0: "ip=dhcp"
        state: present

    - name: "BƯỚC 2: Bật nguồn máy ảo"
      community.general.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_pass }}"
        validate_certs: false
        node: "{{ pve_node }}"
        name: "{{ new_vm_name }}"
        state: started

    - name: "Chờ QEMU Agent báo cáo IP động (Tối đa 10 phút)"
      uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/nodes/{{ pve_node }}/qemu/{{ new_vm_id }}/agent/network-get-interfaces"
        method: GET
        headers: { Cookie: "PVEAuthCookie={{ pve_auth.json.data.ticket }}" }
        validate_certs: false
        status_code: [200, 500]
      register: qga_result
      until:
        - qga_result.status == 200
        - qga_result.json.data.result is defined
        - (qga_result.json.data.result | to_json | regex_search('192\\.168\\.2\\.\\d+'))
      retries: 120
      delay: 5

    - name: "Trích xuất IP DHCP nhận được"
      set_fact:
        dhcp_ip: "{{ qga_result.json.data.result | to_json | regex_findall('192\\.168\\.2\\.\\d+') | first }}"

    - name: "Trích xuất tên Card mạng từ Proxmox QEMU Agent"
      set_fact:
        pve_iface: "{{ qga_result.json.data.result | selectattr('name', '!=', 'lo') | map(attribute='name') | first }}"

    - name: "Nạp máy ảo tạm thời vào bộ nhớ Ansible để SSH"
      add_host:
        name: "{{ dhcp_ip }}"
        groups: temp_vm
        target_static_ip: "{{ target_static_ip }}"
        target_iface: "{{ pve_iface }}"
        ansible_user: ubuntu
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'


# ===================================================================
# PLAY 2: SSH VÀO IP ĐỘNG, SET IP TĨNH, VÀ THOÁT RA (FIRE & FORGET)
# ===================================================================
- name: "Đăng nhập SSH và cấu hình IP Tĩnh"
  hosts: temp_vm
  become: yes
  gather_facts: no
  tasks:
    - name: "Ghi đè cấu hình Netplan sang IP tĩnh"
      copy:
        dest: /etc/netplan/99-static.yaml
        content: |
          network:
            version: 2
            ethernets:
              {{ target_iface }}:
                dhcp4: false
                addresses: [ "{{ target_static_ip }}/24" ]
                routes:
                  - to: default
                    via: 192.168.2.1
                nameservers:
                  addresses: [8.8.8.8, 1.1.1.1]

    - name: "Áp dụng Netplan và ngắt kết nối SSH an toàn"
      shell: "sleep 2 && netplan apply"
      async: 45
      poll: 0
      ignore_errors: true


# ===================================================================
# PLAY 3: CHỜ IP TĨNH LÊN MẠNG VÀ GHI VÀO INVENTORY
# ===================================================================
- name: "Nghiệm thu và Cập nhật Inventory"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Lấy thông số IP tĩnh từ host tạm"
      set_fact:
        final_ip: "{{ hostvars[groups['temp_vm'][0]]['target_static_ip'] }}"
        env_target: "{{ target_env }}"

    - name: "Đợi máy ảo lên mạng với IP tĩnh mới (Tối đa 10 phút)"
      wait_for:
        host: "{{ final_ip }}"
        port: 22
        state: started
        timeout: 600

    - name: "Ghi nhận IP tĩnh mới vào file inventory.ini"
      lineinfile:
        path: inventory.ini
        insertafter: '^\\[{{ env_target }}\\]'
        line: "{{ final_ip }}"
        state: present


# ===================================================================
# PLAY 4: ĐẢM BẢO QUYỀN VÀ SỞ HỮU FILE LOCAL TRÊN CI/CD
# ===================================================================
- name: "Đảm bảo phân quyền các file trong thư mục dự án"
  hosts: localhost
  connection: local
  gather_facts: false
  become: yes
  tasks:
    - name: "Thiết lập quyền (mode) và chủ sở hữu (owner/group) cho từng file"
      file:
        path: "{{ playbook_dir }}/{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: '1_provision.yml', owner: 'ubuntu', group: 'ubuntu', mode: '0777' }
        - { path: '1_provision.yml.bak', owner: 'root', group: 'root', mode: '0755' }
        - { path: '2_security.yml', owner: 'ubuntu', group: 'ubuntu', mode: '0777' }
        - { path: '.git', owner: 'root', group: 'root', mode: '0755' }
        - { path: 'inventory.ini', owner: 'root', group: 'root', mode: '0755' }
        - { path: 'Jenkinsfile', owner: 'root', group: 'root', mode: '0644' }
        - { path: 'requirements.yml', owner: 'root', group: 'root', mode: '0755' }
      ignore_errors: true
